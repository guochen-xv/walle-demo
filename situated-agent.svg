<svg xmlns="http://www.w3.org/2000/svg" width="150" height="125" viewBox="0 0 150 125" fill="none" role="img" aria-labelledby="agent-title agent-desc">
  <title id="agent-title">Situated Agent</title>
  <desc id="agent-desc">An observation card and execution card surround an Agent panel. Open feedback arcs connect the process, and a purple input represents guidance from Situation.</desc>
  <defs>
    <filter id="card-shadow" x="-25%" y="-30%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#725B3D" flood-opacity=".10"/>
    </filter>
  </defs>
  <!-- Open feedback paths stay outside the cards and central panel. -->
  <g stroke="#D5C3AA" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 17C106 7 135 27 134 62"/>
    <path d="m130 58 4 5 4-5"/>
    <path d="M77 108C48 120 20 104 19 74"/>
    <path d="m15 78 4-5 4 5"/>
    <path d="M46 64H50M107 73l8 5"/>
  </g>
  <!-- Current observation: a softly tilted card with a bag and targeting corners. -->
  <g transform="rotate(-8 38 32)">
    <rect x="12" y="11" width="51" height="40" rx="7" fill="#FFFCF7" stroke="#D5C3AA" stroke-width="1.2" filter="url(#card-shadow)"/>
    <g stroke="#A3835C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 23c2-3 15-3 17 0l4 16c-7 3-17 3-24 0Z" fill="#F2EADF"/>
      <path d="M30 28h16m-5 0v4"/>
      <path d="M20 25v-7h7m22 0h7v7M20 37v7h7m22 0h7v-7" stroke="#D5C3AA"/>
      <circle cx="41" cy="32" r="2" fill="#FFFCF7"/>
    </g>
  </g>
  <!-- Situation input, separate from the Agent's warm palette. -->
  <rect x="39" y="60" width="7" height="7" rx="1.8" fill="#8066A5"/>
  <!-- Agent body: solid visual weight, no mouth or antenna. -->
  <rect x="53" y="44" width="53" height="42" rx="13" fill="#F2EADF" stroke="#A3835C" stroke-width="2"/>
  <rect x="60" y="51" width="39" height="27" rx="8" fill="#FFFCF7"/>
  <g fill="#A3835C">
    <rect x="67" y="60" width="5" height="9" rx="2.5"/>
    <rect x="87" y="60" width="5" height="9" rx="2.5"/>
  </g>
  <!-- Execution evidence: offset card with a three-waypoint route and check. -->
  <g transform="rotate(6 117 100)">
    <rect x="94" y="83" width="46" height="32" rx="7" fill="#FFFCF7" stroke="#D5C3AA" stroke-width="1.2" filter="url(#card-shadow)"/>
    <path d="M102 106l9-11 10 9" stroke="#A3835C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFFCF7" stroke="#A3835C" stroke-width="1.2">
      <circle cx="102" cy="106" r="2"/><circle cx="111" cy="95" r="2"/><circle cx="121" cy="104" r="2"/>
    </g>
    <path d="m126 93 2.5 2.5 4.5-5" stroke="#A3835C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
